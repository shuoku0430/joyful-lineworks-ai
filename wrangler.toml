name = "joyful-lineworks-ai"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true
# ダッシュボードで追加した変数をデプロイ時に消さない
keep_vars = true

[vars]
LINEWORKS_SCOPE = "bot"
AI_PROVIDER = "gemini"
GEMINI_MODEL = "gemini-3.8-flash"
# 混雑時などに順に試す予備モデル（カンマ区切り）
GEMINI_FALLBACK_MODELS = "gemini-4-hydrogen,gemini-3.7-flash"
OPENAI_MODEL = "gpt-6-astra"

[observability]
enabled = true
