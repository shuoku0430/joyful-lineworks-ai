name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare secrets
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未登録のためデプロイをスキップしました（README参照）"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Ensure workers.dev subdomain
        if: env.SKIP != '1'
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$A/workers/subdomain"
          cur=$(curl -s -H "Authorization: Bearer $T" "$api" | jq -r '.result.subdomain // empty')
          if [ -n "$cur" ]; then echo "subdomain: $cur.workers.dev"; exit 0; fi
          for name in joyful168 joyful168-kanko joyful-kanko-bus; do
            r=$(curl -s -X PUT -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d "{\"subdomain\":\"$name\"}" "$api")
            if [ "$(echo "$r" | jq -r .success)" = "true" ]; then echo "registered: $name.workers.dev"; exit 0; fi
            echo "$name: $(echo "$r" | jq -c .errors)"
          done
          echo "::error::workers.dev サブドメインを登録できませんでした"; exit 1
      - name: Ensure queue
        if: env.SKIP != '1'
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$A/queues"
          if curl -s -H "Authorization: Bearer $T" "$api?per_page=100" | jq -e '.result[]? | select(.queue_name=="lineworks-jobs")' >/dev/null; then
            echo "queue exists"; exit 0
          fi
          r=$(curl -s -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" -d '{"queue_name":"lineworks-jobs"}' "$api")
          echo "$r" | jq -c '{success, errors}'
          [ "$(echo "$r" | jq -r .success)" = "true" ] || { echo "::error::キューを作成できませんでした（APIトークンに Queues の編集権限が必要）"; exit 1; }
      - uses: cloudflare/wrangler-action@v3
        if: env.SKIP != '1'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
