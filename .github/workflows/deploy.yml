name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare secrets
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未登録のためデプロイをスキップしました（README参照）"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Diagnose Cloudflare token
        if: env.SKIP != '1'
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "token length: ${#T} / account id length: ${#A}"
          echo "token has whitespace: $(printf '%s' "$T" | grep -c '[[:space:]]') / prefix: $(printf '%s' "$T" | cut -c1-4 | sed 's/[A-Za-z0-9]/x/g')"
          echo "account-token verify:"; curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$A/tokens/verify" | jq -c '{success, status: .result.status, errors}' 
          curl -s -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -c '{success, status: .result.status, errors}'
          echo "accounts visible to token (*** = matches CLOUDFLARE_ACCOUNT_ID):"
          curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts?per_page=50" | jq -r '.result[]? | "\(.id)  \(.name)"'
      - uses: cloudflare/wrangler-action@v3
        if: env.SKIP != '1'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
